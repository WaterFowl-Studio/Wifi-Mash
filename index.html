<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wifi Mash</title>
  <style>
    :root {
      font-family: system-ui, sans-serif;
      color: #202124;
      background: #f1f4f8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px 14px;
      display: grid;
      place-items: center;
    }

    main {
      width: min(100%, 620px);
      padding: clamp(22px, 5vw, 36px);
      background: white;
      border: 1px solid #e1e5ea;
      border-radius: 16px;
      box-shadow: 0 12px 36px rgb(24 39 60 / 9%);
    }

    h1 { margin: 0 0 8px; }
    p { line-height: 1.55; color: #596273; }

    label {
      display: block;
      margin: 22px 0 8px;
      font-weight: 650;
    }

    input[type="range"] { width: 100%; accent-color: #0875d1; }

    .value {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin: 22px 0 16px;
    }

    button {
      flex: 1;
      min-height: 44px;
      border: 1px solid #cbd2dc;
      border-radius: 7px;
      background: #f8f9fb;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button.primary {
      border-color: #0875d1;
      background: #0875d1;
      color: white;
    }

    button:disabled { opacity: .55; cursor: not-allowed; }

    .status {
      padding: 13px;
      border-radius: 8px;
      text-align: center;
      background: #eaf5ec;
      color: #246b35;
    }

    .status.running {
      background: #fff3dc;
      color: #785400;
    }

    .note {
      margin-top: 18px;
      padding: 13px;
      border-radius: 8px;
      background: #f1f7fd;
      color: #244767;
      font-size: .94rem;
    }

    @media (max-width: 480px) {
      .controls { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Wifi Mash</h1>
    <p>Run a short, adjustable performance test on this page.</p>

    <label for="intensity">
      Test intensity: <span class="value" id="intensity-value">2</span>/10
    </label>
    <input id="intensity" type="range" min="1" max="10" value="2">

    <label for="duration">
      Duration: <span class="value" id="duration-value">10</span> seconds
    </label>
    <input id="duration" type="range" min="1" max="30" value="10">

    <div class="controls">
      <button class="primary" id="start">Start test</button>
      <button id="stop" disabled>Stop test</button>
    </div>

    <div class="status" id="status" role="status" aria-live="polite">
      Ready
    </div>

    <div class="note">
      The test performs temporary calculations in this browser tab. Start
      with low intensity. Press Stop or close the tab to end the test.
    </div>
  </main>

  <script>
    const intensity = document.querySelector("#intensity");
    const duration = document.querySelector("#duration");
    const intensityValue = document.querySelector("#intensity-value");
    const durationValue = document.querySelector("#duration-value");
    const startButton = document.querySelector("#start");
    const stopButton = document.querySelector("#stop");
    const status = document.querySelector("#status");

    let worker = null;
    let timeoutId = null;

    intensity.addEventListener("input", () => {
      intensityValue.textContent = intensity.value;
    });

    duration.addEventListener("input", () => {
      durationValue.textContent = duration.value;
    });

    function stopTest(message = "Test stopped") {
      if (timeoutId !== null) {
        clearTimeout(timeoutId);
        timeoutId = null;
      }

      if (worker) {
        worker.terminate();
        worker = null;
      }

      startButton.disabled = false;
      stopButton.disabled = true;
      status.textContent = message;
      status.classList.remove("running");
    }

    startButton.addEventListener("click", () => {
      if (worker) return;

      const level = Number(intensity.value);
      const seconds = Number(duration.value);

      // Bounded workload: one worker, capped intensity, capped duration.
      const workerCode = `
        let running = true;
        self.onmessage = () => { running = false; };

        function work() {
          if (!running) return;

          const start = performance.now();
          const workMs = ${level * 8};

          while (running && performance.now() - start < workMs) {
            let value = Math.random();
            for (let i = 0; i < 400; i++) {
              value = Math.sqrt(value + i + 1);
            }
          }

          if (running) setTimeout(work, 16);
        }

        work();
      `;

      try {
        const blob = new Blob([workerCode], { type: "text/javascript" });
        const workerUrl = URL.createObjectURL(blob);
        worker = new Worker(workerUrl);
        URL.revokeObjectURL(workerUrl);
      } catch (error) {
        status.textContent = "Could not start the test in this browser.";
        return;
      }

      startButton.disabled = true;
      stopButton.disabled = false;
      status.textContent = `Test running — ${seconds} second(s)`;
      status.classList.add("running");

      timeoutId = setTimeout(() => {
        stopTest("Test complete");
      }, seconds * 1000);
    });

    stopButton.addEventListener("click", () => stopTest());

    window.addEventListener("pagehide", () => {
      if (worker) worker.terminate();
    });
  </script>
</body>
</html>
